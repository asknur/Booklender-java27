<!DOCTYPE html>
<html lang="ru">
<body>

<div class="book-detail">

    <img src="${book.imageUrl}"
         alt="Обложка ${book.title}"
         class="book-detail-cover">

    <div class="book-detail-info">

        <h1>${book.title}</h1>

        <p class="book-author">
            Автор: ${book.author}
        </p>

        <p class="book-description">
            ${book.description}
        </p>

        <p class="book-status">
            Статус:

            <#if book.taken>
            <span class="status-taken">
                    Выдана сотруднику
                    <a href="/employee?id=${book.isTakenBy}">
                        ${book.isTakenBy}
                    </a>
                </span>
            <#else>
            <span class="status-available">
                    В наличии
                </span>
        </#if>

        </p>

        <a href="/books" class="back-link">
            ← Назад к списку книг
        </a>

    </div>

</div>
</body>
<head>
    <meta charset="UTF-8">
    <title>${book.title}</title>
    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .book-detail {
            display: flex;
            gap: 30px;
            padding: 40px;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            align-items: flex-start;
        }

        .book-detail-cover {
            width: 220px;
            height: 320px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .book-detail-info {
            flex: 1;
        }

        .book-detail-info h1 {
            margin-top: 0;
        }

        .book-author {
            font-size: 18px;
            color: #555;
        }

        .book-description {
            margin-top: 15px;
            line-height: 1.6;
        }

        .book-status {
            margin-top: 20px;
            font-weight: bold;
        }

        .status-available {
            color: green;
        }

        .status-taken {
            color: red;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: #2b7cff;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

    </style>

</head>

</html>
